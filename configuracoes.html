    <button class="menu-toggle" onclick="toggleMenu()">
    <i class="fa-solid fa-bars"></i>
</button>



<div class="sidebar">

        <h2>Contrato Durão</h2>

        <ul>

            <li>
                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="novo.html">
                    <i class="fa-solid fa-file-contract"></i>
                    Novo Contrato

            <li>

                    <i class="fa-solid fa-users"></i>
                    Locatários

            <li>

        <i class="fa-solid fa-building"></i>
        Imóveis

</li>

<li class="active">
                <a href="historico.html">
                    <i class="fa-solid fa-clock-rotate-left"></i>

                <a href="configuracoes.html">

                    Configurações
                </a>

        </ul>

    </div>



    <div class="content">

        <h1>Configurações</h1>



        <div class="card">

            <h2>Dados do Locador</h2>

            <div class="grid">

                <input id="locadorNome" placeholder="Nome do Locador">

                <input id="locadorEstadoCivil" placeholder="Estado Civil">

                <input id="locadorNacionalidade" placeholder="Nacionalidade">

                <input id="locadorProfissao" placeholder="Profissão">

                <input id="locadorRG" placeholder="RG">

                <input id="locadorOrgao" placeholder="Órgão Expedidor">

                <input id="locadorCPF" placeholder="CPF">

                <input id="locadorEndereco" placeholder="Endereço Completo">

            </div>

        </div>



        <div class="card">

            <h2>Configurações Padrão</h2>

            <div class="grid">

                <input id="cidadePadrao" placeholder="Cidade padrão">

                <input id="foroPadrao" placeholder="Foro padrão">

                <input id="numeroInicial" type="number" placeholder="Próximo Nº do Contrato">

            </div>

        </div>

   

        <div class="card">

            <h2>Modelo do Contrato</h2>

            <p>

                Futuramente aqui será possível selecionar o modelo (.docx)
                utilizado para gerar os contratos automaticamente.

            </p>

            <input type="file">

        </div>



        <button onclick="salvarConfiguracoes()">

            <i class="fa-solid fa-floppy-disk"></i>

            Salvar Configurações

        </button>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
