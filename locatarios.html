<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contratos Durão - Locatários</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <button class="menu-toggle" onclick="toggleMenu()">
    <i class="fa-solid fa-bars"></i>
</button>


    <div class="sidebar">

        <h2>Contrato Durão</h2>

        <ul>

            <li>
                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="novo.html">
                    <i class="fa-solid fa-file-contract"></i>
                    Novo Contrato
                </a>
            </li>

            <li>
                <a href="locatarios.html">
                    <i class="fa-solid fa-users"></i>
                    Locatários
                </a>
            </li>

            <li>
    <a href="imoveis.html">
        <i class="fa-solid fa-building"></i>
        Imóveis
    </a>
</li>

<li class="active">
                <a href="historico.html">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    Histórico
                </a>
            </li>

            <li>
                <a href="configuracoes.html">
                    <i class="fa-solid fa-gear"></i>
                    Configurações
                </a>
            </li>

        </ul>

    </div>

    

    <div class="content">

        <h1>Locatários</h1>

        <div class="card">

            <h2>Cadastrar Locatário</h2>

            <div class="grid">

                <input id="nome" type="text" placeholder="Nome Completo">

                <input id="estadoCivil" type="text" placeholder="Estado Civil">

                <input id="nacionalidade" type="text" placeholder="Nacionalidade">

                <input id="profissao" type="text" placeholder="Profissão">

                <input id="rg" type="text" placeholder="Carteira de Identidade">

                <input id="orgao" type="text" placeholder="Órgão Expedidor">

                <input id="cpf" type="text" placeholder="CPF">

                <input id="cidade" type="text" placeholder="Cidade">

            </div>

            <br>

            <button onclick="salvarLocatario()">

                <i class="fa-solid fa-floppy-disk"></i>

                Salvar Locatário

            </button>

        </div>

        <div class="card">

            <h2>Locatários Cadastrados</h2>

            <table>

                <thead>

                    <tr>

                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Cidade</th>
                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody id="tabelaLocatarios">

                    <tr>

                        <td colspan="4" style="text-align:center">

                            Nenhum locatário cadastrado.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
